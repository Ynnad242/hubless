[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubless"
version = "0.9.0"
description = "Configure Logitech G mice on Linux: DPI, polling rate, buttons, onboard profiles and SUPERSTRIKE HITS triggers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []  # PyGObject, GTK 4 and libadwaita come from the distribution
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Hardware",
]

[project.scripts]
hubless = "hubless.__main__:main"

[tool.setuptools.packages.find]
include = ["hubless*"]

[tool.setuptools.package-data]
hubless = ["data/*.css", "data/icons/*.svg"]
