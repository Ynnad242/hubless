# Builds every Linux package and publishes them as a GitHub release when a version tag is pushed:
#   git tag v0.16.1 && git push origin v0.16.1
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }

      - name: Packaging tools (rpm for .rpm, bsdtar for .pacman)
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools libudev-dev

      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vitest run
      - run: npx electron-vite build
      - run: npx electron-builder --linux AppImage deb rpm pacman --publish never

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.AppImage dist/*.deb dist/*.rpm dist/*.pacman)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Hubless ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
          fi
